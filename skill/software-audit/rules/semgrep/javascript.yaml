# Bundled offline rules (JavaScript/TypeScript).
rules:
  - id: js-sql-template-query
    languages: [javascript, typescript]
    severity: ERROR
    message: SQL text built with a template literal or concatenation; use bound parameters.
    pattern-either:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.execute(`...${$X}...`, ...)
      - pattern: $DB.raw(`...${$X}...`, ...)
      - pattern: $DB.$queryRawUnsafe(...)
    metadata: {cwe: "CWE-89"}
  - id: js-child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: Shell command execution with dynamic input.
    patterns:
      - pattern-either:
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
          - pattern: child_process.exec($CMD, ...)
          - pattern: "spawn($CMD, $ARGS, {..., shell: true, ...})"
      - pattern-not: exec("...", ...)
      - pattern-not: execSync("...", ...)
    metadata: {cwe: "CWE-78"}
  - id: js-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval / new Function on dynamic input.
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(...)
      - pattern-not: eval("...")
    metadata: {cwe: "CWE-95"}
  - id: js-xss-sinks
    languages: [javascript, typescript]
    severity: WARNING
    message: HTML injection sink; make sure the value is escaped or sanitised.
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.outerHTML = $X
      - pattern: document.write(...)
      - pattern: <$T dangerouslySetInnerHTML={...} />
    metadata: {cwe: "CWE-79"}
  - id: js-tls-verify-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate verification disabled.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    metadata: {cwe: "CWE-295"}
  - id: js-jwt-no-verify
    languages: [javascript, typescript]
    severity: ERROR
    message: JWT decoded without verification, or 'none' algorithm allowed.
    pattern-either:
      - pattern: jwt.decode(...)
      - pattern: "jwt.verify($T, $K, {..., algorithms: [..., 'none', ...], ...})"
      - pattern: "jwt.verify($T, $K, {..., ignoreExpiration: true, ...})"
    metadata: {cwe: "CWE-347"}
  - id: js-weak-hash
    languages: [javascript, typescript]
    severity: WARNING
    message: MD5/SHA1 used; never for passwords or signatures.
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
    metadata: {cwe: "CWE-328"}
  - id: js-path-join-user-input
    languages: [javascript, typescript]
    severity: WARNING
    message: File path built from request input; check for path traversal.
    pattern-either:
      - pattern: path.join(..., $REQ.params.$P, ...)
      - pattern: path.join(..., $REQ.query.$P, ...)
      - pattern: fs.$F($REQ.params.$P, ...)
      - pattern: fs.$F($REQ.query.$P, ...)
    metadata: {cwe: "CWE-22"}
  - id: js-cors-wildcard-credentials
    languages: [javascript, typescript]
    severity: WARNING
    message: CORS allows any origin.
    pattern-either:
      - pattern: "cors({..., origin: '*', ...})"
      - pattern: "cors({..., origin: true, ...})"
    metadata: {cwe: "CWE-942"}
